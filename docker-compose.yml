services:
  postgres:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  redis:
    image: redis:7-alpine
    env_file: ${ENV_FILE:-.env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  migrate:
    build:
      context: .
    image: ghcr.io/${IMAGE_OWNER:-roman-andr}/cosmetic-bot-backend:${IMAGE_TAG:-local}
    env_file: ${ENV_FILE:-.env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    networks: [internal]

  backend:
    build:
      context: .
    image: ghcr.io/${IMAGE_OWNER:-roman-andr}/cosmetic-bot-backend:${IMAGE_TAG:-local}
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ${GOOGLE_SHEETS_CREDENTIALS_FILE_HOST:-./google-service-account.json}:/run/secrets/google-service-account.json:ro
    networks: [internal]

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/${IMAGE_OWNER:-roman-andr}/cosmetic-bot-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  caddy:
    image: caddy:2.10-alpine
    env_file: ${ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [edge, internal]

  backup:
    image: prodrigestivill/postgres-backup-local:16
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "180"
      BACKUP_KEEP_WEEKS: "0"
      BACKUP_KEEP_MONTHS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-backups:/backups
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  postgres-backups:
  caddy-data:
  caddy-config:

networks:
  edge:
  internal:
    internal: true
