[project]
name = "cosmetic-bot"
version = "0.1.0"
description = "Telegram bot and Mini App for Velina Cosmetic loyalty programme"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17,<4",
    "aiohttp-socks>=0.11,<1",
    "alembic>=1.19.0,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.141.1,<1",
    "gspread>=6.1,<7",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.3.4,<4",
    "pydantic-settings>=2.7,<3",
    "redis>=8.1.0,<9",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "uvicorn[standard]>=0.52.1,<1",
]

[project.scripts]
cosmetic-api = "app.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165.2,<7",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.2,<1",
    "types-openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["alembic"]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
