version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # `typescript` is intentionally pinned to the 6.x line for typescript-eslint
      # compatibility; TS 7 is consumed separately via `@typescript/native` for
      # `tsc -b` in the build script. See PR #38.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /
      - /frontend
      - /deploy/hysteria
    schedule:
      interval: weekly
