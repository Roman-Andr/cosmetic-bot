name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BACKEND_IMAGE: ghcr.io/roman-andr/cosmetic-bot-backend
  FRONTEND_IMAGE: ghcr.io/roman-andr/cosmetic-bot-frontend
  HYSTERIA_IMAGE: ghcr.io/roman-andr/cosmetic-bot-hysteria

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --locked --group dev
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: cosmetic-bot-backend:ci
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: false
          tags: cosmetic-bot-frontend:ci
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/hysteria
          push: false
          tags: cosmetic-bot-hysteria:ci

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      backend_digest: ${{ steps.backend-image.outputs.digest }}
      frontend_digest: ${{ steps.frontend-image.outputs.digest }}
      hysteria_digest: ${{ steps.hysteria-image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: frontend-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - id: hysteria-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./deploy/hysteria
          platforms: linux/amd64
          push: true
          tags: ${{ env.HYSTERIA_IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend-image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend-image.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.HYSTERIA_IMAGE }}
          subject-digest: ${{ steps.hysteria-image.outputs.digest }}
          push-to-registry: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://romanandr.ru
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configure pinned SSH identity
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 0700 -d "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          install -m 0600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Deploy attested image digests
        env:
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend_digest }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYSTERIA_DIGEST: ${{ needs.publish.outputs.hysteria_digest }}
        run: |
          printf '%s\n' "$GH_TOKEN" | ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            deploy "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$HYSTERIA_DIGEST" "$GITHUB_SHA"
      - name: Verify public readiness
        run: curl --fail --show-error --silent --max-time 15 https://romanandr.ru/api/health/ready
